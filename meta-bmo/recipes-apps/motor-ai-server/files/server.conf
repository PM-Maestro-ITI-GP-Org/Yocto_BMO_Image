# motor_ai_server -- read once at startup.
#
# Every key is optional; the value shown is the built-in default, so deleting
# a line and deleting the file do the same thing. Unknown keys are logged and
# ignored. Restart the service to pick up a change:
#
#     systemctl restart motor-ai-server

# Rows per inference window.
#
# This belongs to the model, not to the transport. The AI app's feature
# extraction assumes a 0.1s window of 40kHz current samples, which is 4000
# rows; a different model with a different window moves this number.
#
# It is also the dial for how often the service stalls. Inference blocks the
# reply, and the reply blocks the QNX client, so a window costs one process
# spawn plus one model load. The client sends 200-row batches, so 4000 means
# every 20th batch pays that cost. Lower it to make inference more frequent
# and the stalls more frequent with it; if the client starts logging dropped
# shm blocks, this is the first thing to raise.
window_rows = 4000

# Where window CSVs are written. The unit sets StateDirectory=motor-ai, which
# creates this with the right ownership on every start -- changing the path
# here means changing that too, or the service will be writing somewhere
# systemd is not managing.
csv_dir = /var/lib/motor-ai

# The command run per completed window, as:
#
#     <infer_command> <window.csv> <result.json>
#
# Exit 0 means result.json holds a fresh verdict; anything else means the
# previous one is kept. Shipped by the ai-app recipe, and the reason the
# server can stay untouched while the AI side changes -- see the script
# itself, which documents the contract from the other end.
infer_command = /usr/bin/motor-ai-infer

# How long to wait for it before killing it and keeping the previous verdict.
# Generous on purpose: a TFLite model load on this board is not fast, and a
# timeout that fires during normal operation costs a window every time.
infer_timeout_ms = 10000

# Window CSVs retained; the oldest beyond this are deleted. They are the only
# record of what a verdict was computed from, which is worth keeping a few of.
# Set to 0 to keep every window -- and to then be responsible for the disk.
csv_keep = 10
