# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bmo"
BBFILE_PATTERN_meta-bmo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bmo = "6"

LAYERDEPENDS_meta-bmo = "core"
LAYERSERIES_COMPAT_meta-bmo = "scarthgap"

# The CommonAPI code generators are Eclipse applications and need a JRE. They
# run in the environment of whichever recipe generates bindings (motor-ai-server),
# not the one that installs them, so this has to be global config rather than
# something the generators recipe can declare -- HOSTTOOLS symlinks are created
# once at cooker startup, which is too late for a bbclass to affect.
# NONFATAL so a host without java still builds every other image in this layer.
HOSTTOOLS_NONFATAL += "java"
